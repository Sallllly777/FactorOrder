[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkuquant-backtest"
version = "0.5.0"
description = "Causal factor expressions and daily A-share portfolio simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
factororder = "pkuquant.cli:main"
pkuquant = "pkuquant.cli:main"

[tool.setuptools]
packages = ["pkuquant"]
include-package-data = false

[tool.setuptools.package-data]
pkuquant = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.json"]
